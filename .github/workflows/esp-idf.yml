name: ESP-IDF Build

on:
  push:
    paths:
      - 'core/**'
      - 'ports/esp-idf/**'
      - 'spec/**'
  pull_request:
    paths:
      - 'core/**'
      - 'ports/esp-idf/**'
      - 'spec/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    strategy:
      matrix:
        target: [esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v4

      - name: Build example for ${{ matrix.target }}
        working-directory: ports/esp-idf/example
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build

  host-tests:
    name: Host unit + source-contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pure-function host unit tests
        run: |
          cmake -S ports/esp-idf/tests/host -B build/esp-host
          cmake --build build/esp-host
          ctest --test-dir build/esp-host --output-on-failure

      - name: Source-contract tests
        run: |
          for t in ports/esp-idf/tests/test_*.py; do
            echo "== $t =="
            python3 "$t"
          done
