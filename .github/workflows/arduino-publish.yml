name: Publish Arduino library

# Publishes ports/arduino to the PlatformIO Registry as honch/Honch.
# Trigger by pushing a tag like `arduino-v0.1.0`. The tag version should match
# the `version` field in ports/arduino/library.json (registry versions are
# immutable — a name+version can never be reused, even after unpublishing).
on:
  push:
    tags:
      - "arduino-v*"

jobs:
  publish:
    name: Publish to PlatformIO Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Tag version matches manifest + single-source guard
        run: |
          tag="${GITHUB_REF_NAME#arduino-v}"
          manifest=$(grep -oE '"version":[[:space:]]*"[^"]+"' ports/arduino/library.json | grep -oE '[0-9][^"]+')
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || { echo "::error::tag $tag != manifest $manifest"; exit 1; }
          python3 -m unittest tools.test_version_consistency

      - name: Check vendored core is in sync
        run: bash ports/arduino/scripts/check-core-sync.sh

      - name: Preview package contents
        run: pio pkg pack ports/arduino --output "$RUNNER_TEMP/honch-arduino.tar.gz"

      - name: Publish
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          if [ -z "$PLATFORMIO_AUTH_TOKEN" ]; then
            echo "::warning::PLATFORMIO_AUTH_TOKEN not set — skipping arduino publish"
            exit 0
          fi
          pio pkg publish ports/arduino --owner honch --no-interactive
