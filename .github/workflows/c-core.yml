name: C/POSIX SDK

on:
  push:
    paths:
      - "c-core/**"
      - ".github/workflows/c-core.yml"
  pull_request:
    paths:
      - "c-core/**"
      - ".github/workflows/c-core.yml"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev zlib1g-dev

      - name: Configure
        working-directory: c-core
        run: cmake -S . -B build -DHONCH_BUILD_TESTS=ON -DHONCH_BUILD_EXAMPLES=ON

      - name: Build
        working-directory: c-core
        run: cmake --build build

      - name: Test
        working-directory: c-core
        run: ctest --test-dir build --output-on-failure

      - name: E2E capture
        working-directory: c-core
        env:
          HONCH_E2E_ENDPOINT: ${{ vars.HONCH_E2E_ENDPOINT }}
          HONCH_E2E_TOKEN: ${{ secrets.HONCH_E2E_TOKEN }}
        run: |
          if [ -z "$HONCH_E2E_ENDPOINT" ] || [ -z "$HONCH_E2E_TOKEN" ]; then
            echo "Skipping E2E capture test; HONCH_E2E_ENDPOINT or HONCH_E2E_TOKEN is not configured."
            exit 0
          fi
          cmake -S . -B build-e2e -DHONCH_BUILD_TESTS=ON -DHONCH_BUILD_EXAMPLES=ON -DHONCH_BUILD_E2E=ON
          cmake --build build-e2e
          ctest --test-dir build-e2e --output-on-failure -R honch_c_core_e2e
